<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478" role="img" aria-labelledby="title desc"><title id="title">FreeRTOS HVAC control</title><desc id="desc">STM32 · two tasks · analogue inputs · PWM / GPIO. Sensor task: ADC channels → normalised measurements. Shared measurements: Temperature 0–40 °C · CO₂ 0–2000 ppm. Control task: Threshold rules · combined duty capped at 100%. Actuator outputs: Timer compare registers · heater GPIO</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536d83"/></marker></defs><rect width="960" height="478" rx="18" fill="#f4f7fb"/><text x="48" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#132b42">FreeRTOS HVAC control</text><text x="48" y="78" font-family="sans-serif" font-size="16" fill="#52677b">STM32 · two tasks · analogue inputs · PWM / GPIO</text><path d="M456 173 L499 173" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><path d="M708 234 L252 295" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><path d="M456 361 L499 361" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="112" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="48" y="112" width="6" height="122" rx="3" fill="#176b9c"/><text x="70" y="146" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Sensor task</text><text x="70" y="177" font-family="sans-serif" font-size="15" fill="#475f74">ADC channels → normalised measurements</text><rect x="504" y="112" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="504" y="112" width="6" height="122" rx="3" fill="#176b9c"/><text x="526" y="146" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Shared measurements</text><text x="526" y="177" font-family="sans-serif" font-size="15" fill="#475f74">Temperature 0–40 °C · CO₂ 0–2000 ppm</text><rect x="48" y="300" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="48" y="300" width="6" height="122" rx="3" fill="#176b9c"/><text x="70" y="334" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Control task</text><text x="70" y="365" font-family="sans-serif" font-size="15" fill="#475f74">Threshold rules · combined duty capped at</text><text x="70" y="388" font-family="sans-serif" font-size="15" fill="#475f74">100%</text><rect x="504" y="300" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="504" y="300" width="6" height="122" rx="3" fill="#176b9c"/><text x="526" y="334" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Actuator outputs</text><text x="526" y="365" font-family="sans-serif" font-size="15" fill="#475f74">Timer compare registers · heater GPIO</text></svg>
